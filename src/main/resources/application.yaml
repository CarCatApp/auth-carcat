server:
  port: 9090

springdoc:
  swagger-ui:
    persist-authorization: true
    try-it-out-enabled: true
    custom-js: /swagger-custom.js

carland:
  internal-token: ${CARLAND_INTERNAL_TOKEN:}
  swagger:
    public-server-url: ${SWAGGER_PUBLIC_SERVER_URL:https://digital-innovation.agency/auth/server}
  issuer:
    key: "carland"
  api:
    url: "http://carland-service:9091"
  admin:
    panel-phone: ${ADMIN_PANEL_PHONE}
    panel-pin: ${ADMIN_PANEL_PIN}
    legacy-panel-phone: ${ADMIN_PANEL_LEGACY_PHONE:+994000000000}

spring:
  application:
    name: carland_auth
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/authdatabase}
    username: ${SPRING_DATASOURCE_USERNAME:username}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: true
msm:
  api:
    url: ${MSM_API_URL:http://api.msm.az}
    username: ${MSM_API_USERNAME}
    apikey: ${MSM_API_KEY}
    sendername: ${MSM_API_SENDER:AL&GO}
  response:
    success:
      message: errno=100
lsim:
  api:
    url: ${LSIM_API_URL:https://apps.lsim.az}
    login: ${LSIM_API_LOGIN}
    password: ${LSIM_API_PASSWORD}
    sender: ${LSIM_API_SENDER:CarCat}
  balance-alert:
    thresholds: ${LSIM_BALANCE_ALERT_THRESHOLDS:1500,1270,1000,500}
    phones: ${LSIM_BALANCE_ALERT_PHONES}

otp:
  expiration-minutes: 3
  new:
    resend-cooldown-seconds: 30
    max-sends-per-window: 3
    send-window-minutes: 15
    phone-lock-minutes: 5
    ip-lock-hours: 24
    max-verify-attempts: 3
    verify-lock-minutes: 5

auth:
  rate-limit:
    phone-per-minute: 10
    ip-per-minute: 30

pin:
  max-attempts: 3
  attempt-window-minutes: 10
  lock-duration-minutes: 5


access:
  token:
    secret-key: ${ACCESS_TOKEN_SECRET_KEY}
    expiration: 900 # 900 seconds 15 minutes


authentication:
  token:
    secret-key: ${AUTHENTICATION_TOKEN_SECRET_KEY}
    expiration: 360 # seconds 6 minutes

refresh:
  token:
    secret-key: ${REFRESH_TOKEN_SECRET_KEY}
    expiration: 31536000 # seconds = 1 year (365 days)
